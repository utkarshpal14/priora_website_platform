<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E3A8A"/>
      <stop offset="50%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#070A14"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="100%" stop-color="#EAB308"/>
    </linearGradient>
    <linearGradient id="roseGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FB7185"/>
      <stop offset="100%" stop-color="#E11D48"/>
    </linearGradient>
    <linearGradient id="violetGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C084FC"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.84" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <!-- Background with rounded corners -->
  <rect width="192" height="192" rx="42.24" fill="url(#bgGrad)"/>
  <!-- Border outline -->
  <rect x="3.84" y="3.84" width="184.32" height="184.32" rx="38.400000000000006" fill="none" stroke="#38BDF8" stroke-width="2.88" stroke-opacity="0.4"/>
  
  <!-- 2x2 Glowing Polyomino Block Pattern -->
  <!-- Block 1: Cyan Top Left -->
  <rect x="42.24" y="42.24" width="48" height="48" rx="7.68" fill="url(#cyanGrad)" filter="url(#glow)"/>
  <!-- Block 2: Gold Top Right -->
  <rect x="101.76" y="42.24" width="48" height="48" rx="7.68" fill="url(#goldGrad)" filter="url(#glow)"/>
  <!-- Block 3: Violet Bottom Left -->
  <rect x="42.24" y="101.76" width="48" height="48" rx="7.68" fill="url(#violetGrad)" filter="url(#glow)"/>
  <!-- Block 4: Rose Bottom Right -->
  <rect x="101.76" y="101.76" width="48" height="48" rx="7.68" fill="url(#roseGrad)" filter="url(#glow)"/>
  
  <!-- Inner Highlight Gloss -->
  <circle cx="57.599999999999994" cy="53.760000000000005" r="5.76" fill="#FFFFFF" fill-opacity="0.6"/>
  <circle cx="117.12" cy="53.760000000000005" r="5.76" fill="#FFFFFF" fill-opacity="0.6"/>
  <circle cx="57.599999999999994" cy="113.28" r="5.76" fill="#FFFFFF" fill-opacity="0.6"/>
  <circle cx="117.12" cy="113.28" r="5.76" fill="#FFFFFF" fill-opacity="0.6"/>

  <!-- Logo Typography -->
  <text x="96" y="172.8" font-family="'Poppins', 'Segoe UI', sans-serif" font-weight="800" font-size="21.12px" fill="#FFFFFF" text-anchor="middle" letter-spacing="2">BLOCKZU</text>
</svg>